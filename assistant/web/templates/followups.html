{% extends "base.html" %}{% block content %}<h1>跟进待办</h1><p>这里只提供预览、人工分类和跳过，不会自动发送。</p><form method="get"><label>阶段 <input name="stage" value="{{ filters.stage }}"></label><label>状态 <input name="status" value="{{ filters.status }}"></label><label>语言 <input name="language" value="{{ filters.language }}"></label><label>样品状态 <input name="curr_status" value="{{ filters.curr_status or '' }}"></label><button>筛选</button></form><table><tr><th>达人</th><th>阶段</th><th>状态</th><th>语言</th><th>样品状态</th></tr>{% for task, sample_case in rows %}<tr><td><a href="/followups/{{ task.id }}">{{ sample_case.creator_name }}</a></td><td>{{ task.stage }}</td><td>{{ task.status }}</td><td>{{ task.language }}</td><td>{{ sample_case.curr_status }}</td></tr>{% endfor %}</table>{% endblock %}
