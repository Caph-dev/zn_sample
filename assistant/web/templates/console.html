<!doctype html>
<html lang="zh-CN" data-astryx-theme="geist" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page_title }} · {{ app_name }}</title>
  <link rel="preload" href="/static/fonts/Geist.woff2" as="font" type="font/woff2" crossorigin>
  <!-- Astryx 页面正文样式（构建产物），console-shell.css 只补 app.js 动态 DOM。 -->
  <link rel="stylesheet" href="/static/console/assets/index.css?v={{ static_version }}">
  <!-- 主题必须在组件样式之后加载：产物里默认主题在 @layer astryx-base，主题文件在 @layer astryx-theme，
       layer 顺序按首次出现决定，先加载主题会被默认值压住。 -->
  <link rel="stylesheet" href="/static/geist-theme.css?v={{ static_version }}">
  <link rel="stylesheet" href="/static/console-shell.css?v={{ static_version }}">
  <script src="/static/app.js?v={{ static_version }}" defer></script>
</head>
<body>
  <div id="console-root"></div>
{% include "_task_panel.html" %}
  <script id="console-bootstrap" type="application/json">{{ page_payload | tojson }}</script>
  <script type="module" src="/static/console/assets/index.js?v={{ static_version }}"></script>
</body>
</html>
